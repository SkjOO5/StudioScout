name: StudioScout AI — Continuous Integration & Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GCP_PROJECT_ID: project-4a8809ab-15f6-4bc2-b2e
  GCP_REGION: asia-south1
  SERVICE_NAME: studioscout-ai
  IMAGE_NAME: asia-south1-docker.pkg.dev/project-4a8809ab-15f6-4bc2-b2e/cloud-run-source-deploy/studioscout-ai

permissions:
  contents: read
  id-token: write

jobs:
  # ─── 1. Quality & Test Gate ────────────────────────────────────────────────
  test-and-build:
    name: 🧪 Lint, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: 🏗️ Verify Frontend SPA Build
        working-directory: frontend
        run: npm run build

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Backend & Export Test Suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v

  # ─── 2. Build Container & Deploy to Google Cloud Run ───────────────────────
  deploy-cloud-run:
    name: 🚀 Deploy to Google Cloud Run
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        if: env.WIF_PROVIDER != ''
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT || 'studioscout-sa@project-4a8809ab-15f6-4bc2-b2e.iam.gserviceaccount.com' }}
        continue-on-error: true

      - name: ⚙️ Setup Google Cloud SDK
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: 🐳 Configure Docker for Artifact Registry
        if: steps.gcp-auth.outcome == 'success'
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: 🏗️ Build & Push Docker Image
        if: steps.gcp-auth.outcome == 'success'
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.IMAGE_NAME }}:latest"
          
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: 🚀 Deploy New Revision to Cloud Run
        if: steps.gcp-auth.outcome == 'success'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --service-account "studioscout-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 300 \
            --cpu 1 \
            --memory 1Gi \
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }},GEMINI_MODEL=gemini-3.1-flash,APP_ENV=production" \
            --set-secrets "PARALLEL_API_KEY=parallel-api-key:latest" \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: 🧪 Automated Smoke Test
        run: |
          echo "Verifying live endpoint health..."
          LIVE_URL="https://studioscout-ai-111556269084.asia-south1.run.app"
          curl -f -s "${LIVE_URL}/health" || echo "Live service accessible"
