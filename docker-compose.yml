version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:4173
      - STUDIOSCOUT_DB_PATH=/data/studioscout.db
    volumes:
      - ./backend/app:/app/app
      - studioscout_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  studioscout_data:
